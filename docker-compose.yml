services:
  neo4j:
    image: neo4j:5.26.2
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      # Coolify injects all NEO4J_* env vars into every container.
      # Disable strict config validation so Neo4j ignores unknown vars
      # like NEO4J_URI, NEO4J_USER, NEO4J_PASSWORD (valid for the app, not for Neo4j).
      NEO4J_server_config_strict__validation_enabled: "false"
    volumes:
      - neo4j_data_v2:/data
    # Contain Neo4j RAM usage so it can't starve the host.
    # Heap is 1g max + ~512m for page cache and overhead → 2g is safe.
    mem_limit: 2g
    mem_reservation: 1g
    # Con 10 s (lo de por defecto) un redespliegue puede cortar a Neo4j a mitad de un checkpoint
    stop_grace_period: 60s
    # Solo para que `docker ps`/Coolify enseñen si está sano. A propósito el servicio de la app NO espera a esto
    # con `depends_on: service_healthy`: con Neo4j caído, un redespliegue dejaría fuera TAMBIÉN el inicio de
    # sesión, los proyectos y los informes ya hechos, que no lo necesitan. Para eso está /health/ready.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  mirofish:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    restart: unless-stopped
    # PID 1 propio (tini): recoge procesos huérfanos (cada simulación es un proceso aparte) y reenvía SIGTERM
    init: true
    # Al apagar, la app termina las simulaciones vivas y vuelca la memoria del grafo (varios segundos). Con los 10 s
    # de por defecto Docker la mataba a medias; lo que quede en «running» lo marca como fallido el arranque siguiente.
    stop_grace_period: 60s
    depends_on:
      - neo4j
    environment:
      - PYTHONUNBUFFERED=1
      - NODE_ENV=production
      - FLASK_DEBUG=false
      - FLASK_PORT=8000
      # Jev (TypeSafe): filtro de entidades antes de crear agentes. Sin clave, no filtra.
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - JEV_ENTITY_FILTER=${JEV_ENTITY_FILTER:-true}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY}
      - API_AUTH_REQUIRED=${API_AUTH_REQUIRED:-true}
      - API_AUTH_TOKEN=${API_AUTH_TOKEN:-}
      - POCKETBASE_URL=${POCKETBASE_URL:-https://pocketbase.koolgrowth.com}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME}
      # Graphiti graph-extraction LLM (independent provider for reliable
      # json_schema support — e.g. DeepSeek-V3 or Qwen-Plus).  Each var
      # falls back to its LLM_* counterpart when unset.
      - GRAPHITI_LLM_API_KEY=${GRAPHITI_LLM_API_KEY:-}
      - GRAPHITI_LLM_BASE_URL=${GRAPHITI_LLM_BASE_URL:-}
      - GRAPHITI_LLM_MODEL_NAME=${GRAPHITI_LLM_MODEL_NAME:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      # Vision LLM (imágenes subidas como semilla). Cada una cae a su LLM_* si está vacía.
      - VISION_LLM_API_KEY=${VISION_LLM_API_KEY:-}
      - VISION_LLM_BASE_URL=${VISION_LLM_BASE_URL:-}
      - VISION_LLM_MODEL_NAME=${VISION_LLM_MODEL_NAME:-}
    volumes:
      - mirofish_uploads:/app/backend/uploads
      - mirofish_logs:/app/backend/logs
      # caché de modelos: el recomendador (1,1 GB) se descarga una vez, no en cada despliegue
      - mirofish_hf_cache:/root/.cache/huggingface
    # Contain OASIS (BERT + simulation) memory usage so a runaway
    # simulation can only kill MiroFish itself, never cascade into other
    # Coolify apps on the same host. If the process exceeds mem_limit
    # Docker SIGKILLs it and the container auto-restarts thanks to
    # `restart: unless-stopped`. The localized SIGKILL/OOM error in the
    # UI tells the user to reduce agents or extend RAM.
    mem_limit: 4g
    mem_reservation: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  neo4j_data_v2:
  mirofish_uploads:
  mirofish_logs:
  mirofish_hf_cache:
