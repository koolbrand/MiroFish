[project]
name = "mirofish-backend"
version = "0.1.0"
description = "Simuloo - 简洁通用的群体智能引擎，预测万物"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Simuloo Team" }
]

dependencies = [
    # 核心框架
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    "flask-limiter>=3.5.0",
    # LLM 相关
    "openai>=1.0.0",
    # Graphiti + Neo4j (self-hosted graph memory)
    "graphiti-core>=0.3.0",
    "neo4j>=5.0.0",
    # OASIS 社交媒体模拟
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    # 文件处理
    "PyMuPDF>=1.24.0",
    # Image processing — resize before base64-encoding for vision LLM calls
    "pillow>=10.0.0",
    # 编码检测（支持非UTF-8编码的文本文件）
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    # 工具库
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    # Bounded TTL cache for PocketBase token validation (security.py)
    "cachetools>=5.3.0",
    "weasyprint>=70",
    "markdown>=3.5",
    # Llega por camel-ai/OASIS/sentence-transformers; se declara aquí para poder elegir su índice (ver
    # [tool.uv.sources]) — uv solo aplica `sources` a las dependencias directas. Misma versión que ya corría.
    "torch==2.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# camel-ai 0.2.78 pide pillow<11, y esas versiones tienen avisos de seguridad graves (Pillow lee imágenes que
# suben los usuarios). camel solo importa PIL para mensajes multimodales que Simuloo no usa. Se fuerza una
# versión corregida; los tests de imágenes (test_cost_limits) y el arranque de OASIS comprueban que sigue valiendo.
override-dependencies = ["pillow>=12.3.0"]

# PyTorch solo CPU en Linux (el servidor no tiene GPU). `torch-backend = "cpu"`, que estaba aquí, solo vale para
# `uv pip`, no para `uv sync`: la imagen llevaba torch 2.9.1+cu128 con `nvidia/` (4,3 GB) y `triton` (0,6 GB)
# — medido el 1-oct-2026 —, cinco veces más de lo que el comentario prometía. En macOS (desarrollo) PyPI ya da la
# versión de CPU/MPS, por eso el índice solo se aplica a Linux.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
