name: CI

# Antes no corría ningún test en GitHub: lo único automático era publicar la imagen (docker-image.yml), así que una
# rama rota llegaba a `main` y a Coolify sin que nada la parara. Esto corre en cada PR y en cada push a main, y
# `docker-image.yml` lo exige antes de publicar.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Las mismas librerías del sistema que la imagen de producción: sin ellas los tests del PDF (WeasyPrint)
      # se saltan en local (macOS) y aquí fallarían por otra razón
      - name: Librerías del sistema (PDF y fuentes)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core fonts-wqy-microhei

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.26"            # la misma que el Dockerfile
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: El lock está al día con pyproject.toml
        working-directory: backend
        run: uv lock --check

      - name: Instalar dependencias (con las de desarrollo)
        working-directory: backend
        run: uv sync --frozen

      - name: Tests
        working-directory: backend
        env:
          # Ningún test debe llamar a un proveedor real: si alguno lo intentara, falla en vez de gastar dinero
          LLM_API_KEY: ci-sin-red
          LLM_BASE_URL: http://127.0.0.1:9/v1
          NEO4J_PASSWORD: ci-sin-neo4j
          NEO4J_URI: bolt://127.0.0.1:9
          SECRET_KEY: ci
        run: uv run pytest -q -p no:cacheprovider

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar
        working-directory: frontend
        run: npm ci
      - name: Regresiones de interfaz y ciclo de vida
        working-directory: frontend
        run: node --test tests/*.test.js
      - name: Compilar
        working-directory: frontend
        run: npm run build

  docker:
    name: Imagen Docker (se construye, no se publica)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: El compose es válido
        env:
          NEO4J_PASSWORD: ci
          SECRET_KEY: ci
        run: docker compose -f docker-compose.yml config --quiet

      - uses: docker/setup-buildx-action@v3
      - name: Construir la imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Avisos de seguridad de dependencias: informativo. Hay avisos que hoy no se pueden resolver (graphiti-core, transformers
  # y unstructured los bloquean camel-ai/OASIS), así que este job NO falla: una cruz roja permanente en cada PR
  # enseña a ignorar el CI. El resultado sale en el resumen del job (pestaña «Summary» de la ejecución).
  audit:
    name: Avisos de seguridad (informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.26"
      - name: pip-audit (backend)
        working-directory: backend
        continue-on-error: true
        run: |
          uv export --frozen --no-hashes --no-emit-project --no-dev > /tmp/req.txt
          { echo '### pip-audit (backend)'; echo '```'; uvx pip-audit --no-deps --disable-pip -r /tmp/req.txt 2>&1 || true; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (frontend, solo producción)
        working-directory: frontend
        continue-on-error: true
        run: |
          { echo '### npm audit (frontend, producción)'; echo '```'; npm audit --omit=dev --audit-level=high 2>&1 || true; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
